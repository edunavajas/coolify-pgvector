# PostgreSQL + pgvector para Coolify
# Importar como "Docker Compose from a Git repository".
# Coolify gestiona la red y el enrutado: no añadir etiquetas de Traefik aquí.
#
# Nota importante: se construye una imagen propia (build: .) porque Coolify no monta
# el código del repositorio en despliegues de Docker Compose. Ver el Dockerfile y el
# README (sección "Por qué hay un Dockerfile").
#
# El servicio se llama "knowledge-db" A PROPÓSITO (y no "postgres"). En la red
# compartida de Coolify el nombre del servicio es el hostname; si lo llamas "postgres"
# puede chocar con OTRO contenedor postgres de la misma red y n8n acabará conectando
# a la base equivocada (error "password authentication failed"). Un nombre único evita
# esa colisión.
services:
  knowledge-db:
    build: .
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-knowledge}
      # Contraseña: DEBE sobrescribirse en Coolify. El valor por defecto es solo para desarrollo local.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_overwrite_in_coolify}
      POSTGRES_DB: ${POSTGRES_DB:-knowledge}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Puerto público OPCIONAL, solo para depuración. Descomentar si se necesita
    # conectarse desde fuera (por ejemplo con un cliente SQL externo).
    # No es necesario: n8n se conecta por la red interna de Coolify.
    # ports:
    #   - "${POSTGRES_DEBUG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-knowledge} -d ${POSTGRES_DB:-knowledge}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
